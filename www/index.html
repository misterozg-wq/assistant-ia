<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistant IA</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --txt:#e8eaef; --mut:#8b93a3; --acc:#4f8cff; --usr:#2b5cd6; --ok:#2fbf71; --ko:#e5534b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  header { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:17px; margin:0; flex:1; }
  #status { font-size:12px; color:var(--mut); }
  button { background:var(--line); color:var(--txt); border:0; border-radius:10px; padding:8px 12px; font-size:15px; }
  button.primary { background:var(--acc); color:#fff; }
  #chat { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 12px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--usr); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bot pre { background:#0a0c10; padding:8px; border-radius:8px; overflow-x:auto; white-space:pre; }
  .tag { display:block; font-size:11px; color:var(--mut); margin-top:6px; }
  .sys { align-self:center; font-size:12px; color:var(--mut); text-align:center; }
  footer { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); background:var(--panel); }
  textarea { flex:1; resize:none; background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:12px; padding:10px; font:inherit; max-height:140px; }
  #settings { position:fixed; inset:0; background:var(--bg); overflow-y:auto; padding:16px; padding-top:calc(16px + env(safe-area-inset-top)); display:none; }
  #settings.open { display:block; }
  .prov { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .prov .row { display:flex; align-items:center; gap:8px; }
  .prov .name { flex:1; font-weight:600; }
  .prov input[type=text], .prov input[type=password], #sysPrompt { width:100%; margin-top:8px; background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; font-size:14px; }
  .hint { font-size:12px; color:var(--mut); margin-top:6px; }
  .hint a { color:var(--acc); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--mut); }
  .dot.ok { background:var(--ok); } .dot.ko { background:var(--ko); }
</style>
</head>
<body>
<div id="app">
  <header>
    <select id="profile" style="flex:1;background:var(--panel);color:var(--txt);border:0;font-size:17px;font-weight:600;min-width:0"></select>
    <span id="status"></span>
    <button id="btnNew" title="Nouvelle conversation">＋</button>
    <button id="btnSettings" title="Réglages">⚙</button>
  </header>
  <div id="chat"></div>
  <footer>
    <textarea id="input" rows="1" placeholder="Votre question…"></textarea>
    <button id="btnSend" class="primary">➤</button>
  </footer>
</div>

<div id="settings">
  <div style="display:flex;align-items:center;margin-bottom:12px">
    <h2 style="flex:1;margin:0;font-size:19px">Réglages</h2>
    <button id="btnClose" class="primary">OK</button>
  </div>
  <p class="hint">Les IA sont essayées dans l'ordre ci-dessous. Si l'une atteint sa limite (quota, erreur, clé invalide), l'app bascule automatiquement sur la suivante. Les clés restent stockées uniquement sur ce téléphone.</p>
  <div id="provList"></div>
  <div class="prov">
    <div class="name">Instructions du profil « <span id="profName"></span> »</div>
    <textarea id="sysPrompt" rows="10"></textarea>
    <button id="btnPromptReset" style="margin-top:8px">↺ Instructions par défaut</button>
  </div>
  <button id="btnReset">Réinitialiser l'état des quotas</button>
</div>

<script>
// ---------- Fournisseurs (tous via une API compatible OpenAI) ----------
const DEFAULT_PROVIDERS = [
  { id:'pollinations', name:'Pollinations (intégré)', url:'https://gen.pollinations.ai/v1/chat/completions', model:'openai', enabled:true, noKey:true, anonKey:'pk_9LSWbR1pdhYD7S84',
    help:'Clé de l\'app intégrée : rien à saisir. Votre propre clé (facultative) : <a href="https://enter.pollinations.ai" target="_blank">enter.pollinations.ai</a>' },
  { id:'deepseek_or', name:'OpenRouter (modèles gratuits)', url:'https://openrouter.ai/api/v1/chat/completions', model:'openrouter/free', enabled:true,
    help:'Clé gratuite : <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a> — « openrouter/free » choisit automatiquement un modèle gratuit.' },
  { id:'llm7', name:'LLM7.io (gratuit, sans clé)', url:'https://api.llm7.io/v1/chat/completions', model:'default', enabled:true, noKey:true, anonKey:'unused',
    help:'Fonctionne sans clé. Clé gratuite facultative (limites plus hautes) : <a href="https://token.llm7.io" target="_blank">token.llm7.io</a>' },
  { id:'cohere', name:'Cohere (gratuit, 1000 messages/mois)', url:'https://api.cohere.ai/compatibility/v1/chat/completions', model:'command-a-03-2025', enabled:true,
    help:'Clé d\'essai gratuite, sans carte : <a href="https://dashboard.cohere.com/api-keys" target="_blank">dashboard.cohere.com</a> — usage non commercial.' },
  { id:'nvidia', name:'NVIDIA NIM (gratuit)', url:'https://integrate.api.nvidia.com/v1/chat/completions', model:'openai/gpt-oss-120b', enabled:true,
    help:'Clé gratuite (vérification par SMS) : <a href="https://build.nvidia.com" target="_blank">build.nvidia.com</a>' },
];

const DEFAULT_SYSTEM = "Tu es un assistant expert des smartphones (Android et iPhone) : réglages, applications, dépannage, sécurité, batterie, sauvegarde, transfert de données, réseaux et Wi-Fi. Réponds en français, de façon claire et concise, avec des étapes numérotées quand c'est utile. Pour les autres sujets, réponds aussi de ton mieux.";

// ---------- Stockage ----------
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const OLD_MODELS = ['deepseek/deepseek-chat-v3-0324:free','gemini-2.5-flash','llama-3.3-70b-versatile'];
const badModel = m => !m || OLD_MODELS.includes(m) || /^gen-lang-client|^projects\//i.test(m);
let providers = mergeProviders(load('providers', null));
if (load('orderV', 0) < 2) { providers.sort((a, b) => (b.id === 'pollinations') - (a.id === 'pollinations')); save('orderV', 2); }
let keys      = load('keys', {});
Object.keys(keys).forEach(k => { if (!DEFAULT_PROVIDERS.find(p => p.id === k)) delete keys[k]; });
let cooldown  = load('cooldown', {});          // id -> timestamp jusqu'auquel on saute ce fournisseur
const PROFILES = {
  juridique:  { name:'⚖️ Droit & assurances', prompt:"Tu es un assistant juridique généraliste, spécialisé en droit français, en assurances et en droits sociaux. Tu réponds en français, de façon claire, structurée et concise.\n\nDomaines : droit civil (contrats, famille, succession, logement, voisinage), droit de la consommation, droit du travail, droit administratif courant ; assurances (Code des assurances, Code de la mutualité, santé, prévoyance, habitation, auto, multirisque professionnelle, emprunteur, responsabilité civile, sinistres, résiliation : lois Chatel, Hamon, Lemoine, résiliation infra-annuelle) ; protection sociale et droits sociaux (Sécurité sociale, CPAM, arrêts de travail, invalidité, accidents du travail, retraite, chômage France Travail, CAF, RSA, APL, MDPH, complémentaire santé solidaire).\n\nMéthode :\n1. Si la situation est floue, pose d'abord 1 à 3 questions précises (statut, dates, montants, type de contrat).\n2. Donne la réponse directe, puis les règles applicables en citant les articles de loi uniquement si tu en es sûr.\n3. Indique les démarches concrètes, délais, pièces à fournir et interlocuteurs (assureur, médiateur, CPAM, inspection du travail, conciliateur, avocat).\n4. Propose si utile un modèle de courrier (réclamation, résiliation, contestation, mise en demeure).\n\nRègles :\n- Distingue clairement ce qui est certain de ce qui dépend du contrat ou de la jurisprudence.\n- Les montants, plafonds et barèmes changent chaque année : signale-le et renvoie vers Légifrance, service-public.fr ou ameli.fr pour vérification.\n- N'invente jamais un article de loi, une jurisprudence ou un chiffre.\n- Pour un litige important ou une procédure judiciaire, recommande de consulter un avocat ou un juriste.\n- Pour les autres sujets, réponds aussi de ton mieux." },
  smartphone: { name:'📱 Smartphone', prompt:DEFAULT_SYSTEM },
};
let prompts   = load('prompts', {});
let histories = load('histories', null);
if (!histories) {               // migration ancienne version
  histories = { smartphone: load('history', []) };
  const old = load('system', null); if (old && old !== DEFAULT_SYSTEM) prompts.smartphone = old;
}
let profile = load('profile', 'juridique'); if (!PROFILES[profile]) profile = 'juridique';
let systemPrompt = prompts[profile] || PROFILES[profile].prompt;
let history   = histories[profile] || [];

function mergeProviders(saved) {
  if (!saved) return DEFAULT_PROVIDERS.map(p => ({...p}));
  const byId = Object.fromEntries(DEFAULT_PROVIDERS.map(p => [p.id, p]));
  const out = saved.filter(s => byId[s.id]).map(s => ({...byId[s.id], model:badModel(s.model) ? byId[s.id].model : s.model, enabled:s.enabled}));
  DEFAULT_PROVIDERS.forEach(p => { if (!out.find(o => o.id === p.id)) out.push({...p}); });
  return out;
}
const persist = () => {
  save('providers', providers.map(p => ({id:p.id, model:p.model, enabled:p.enabled})));
  save('keys', keys); save('cooldown', cooldown); histories[profile] = history; save('histories', histories); save('prompts', prompts); save('profile', profile);
};

// ---------- Interface chat ----------
const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('input');

function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function md(s){
  let h = esc(s);
  h = h.replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, c) => '<pre>' + c + '</pre>');
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  return h;
}
function addMsg(role, text, by) {
  const d = document.createElement('div');
  if (role === 'sys') { d.className = 'sys'; d.textContent = text; }
  else {
    d.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    d.innerHTML = role === 'user' ? esc(text) : md(text);
    if (by) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = by; d.appendChild(t); }
  }
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
function render() {
  chat.innerHTML = '';
  if (!history.length) addMsg('sys', 'Posez votre question.');
  history.forEach(m => addMsg(m.role, m.content, m.by));
}
function setStatus(t){ $('status').textContent = t || ''; }

// ---------- Appel avec bascule automatique ----------
function classify(status, body) {
  const b = (body || '').toLowerCase();
  if (status === 429 || b.includes('quota') || b.includes('rate limit') || b.includes('resource_exhausted')) return {reason:'limite atteinte', wait: 15*60*1000};
  if (status === 402 || b.includes('insufficient') || b.includes('credit') || b.includes('balance')) return {reason:'crédit épuisé', wait: 6*3600*1000};
  if (status === 401 || status === 403) return {reason:'clé refusée', wait: 0};
  if (status >= 500) return {reason:'service indisponible', wait: 2*60*1000};
  if (status === 0) return {reason:'erreur réseau', wait: 0};
  if (status === 404) return {reason:'modèle introuvable (vérifier le nom du modèle dans ⚙)', wait: 0};
  return {reason:'erreur ' + status, wait: 0};
}

async function callProvider(p, messages) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  try {
    const r = await fetch(p.url, {
      method:'POST', signal: ctrl.signal,
      headers: Object.assign({ 'Content-Type':'application/json' }, (keys[p.id] || p.anonKey) ? { 'Authorization':'Bearer ' + (keys[p.id] || p.anonKey) } : {}),
      body: JSON.stringify({ model:p.model, messages, temperature:0.7 })
    });
    const txt = await r.text();
    if (!r.ok) return { ok:false, status:r.status, body:txt };
    const j = JSON.parse(txt);
    const content = j.choices?.[0]?.message?.content;
    if (!content) return { ok:false, status:500, body:'réponse vide' };
    return { ok:true, content };
  } catch (e) {
    return { ok:false, status:0, body:String(e) };
  } finally { clearTimeout(timer); }
}

async function ask(userText) {
  const messages = [{role:'system', content:systemPrompt},
    ...history.slice(-20).map(m => ({role:m.role, content:m.content})),
    {role:'user', content:userText}];
  const now = Date.now();
  const candidates = providers.filter(p => p.enabled && (keys[p.id] || p.noKey));
  if (!candidates.length) return { error:'Aucune IA activée. Ouvrez ⚙ Réglages.' };

  // D'abord ceux qui ne sont pas en pause, puis ceux en pause en dernier recours
  const ordered = [...candidates.filter(p => !(cooldown[p.id] > now)), ...candidates.filter(p => cooldown[p.id] > now)];
  const notes = [];
  for (const p of ordered) {
    setStatus(p.name + '…');
    const res = await callProvider(p, messages);
    if (res.ok) { delete cooldown[p.id]; persist(); setStatus(''); return { content:res.content, by:p.name, notes }; }
    const c = classify(res.status, res.body);
    if (c.wait) cooldown[p.id] = Date.now() + c.wait;
    let detail = ''; try { const j = JSON.parse(res.body); detail = (Array.isArray(j) ? j[0] : j)?.error?.message || ''; } catch {}
    notes.push(p.name + ' : ' + c.reason + (detail ? ' (' + detail.slice(0,120) + ')' : '') + ' → bascule');
    persist();
  }
  setStatus('');
  return { error:'Toutes les IA ont échoué :\n' + notes.join('\n'), notes };
}

let busy = false;
async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; $('btnSend').disabled = true;
  input.value = ''; autosize();
  addMsg('user', text);
  const wait = addMsg('sys', '…');
  const res = await ask(text);
  wait.remove();
  if (res.notes) res.notes.forEach(n => { if (!res.error) addMsg('sys', n); });
  if (res.error) { addMsg('sys', res.error); }
  else {
    history.push({role:'user', content:text}, {role:'assistant', content:res.content, by:res.by});
    persist(); addMsg('assistant', res.content, res.by);
  }
  busy = false; $('btnSend').disabled = false;
}

// ---------- Réglages ----------
function renderSettings() {
  const list = $('provList'); list.innerHTML = '';
  const now = Date.now();
  providers.forEach((p, i) => {
    const paused = cooldown[p.id] > now;
    const div = document.createElement('div'); div.className = 'prov';
    div.innerHTML = `
      <div class="row">
        <span class="dot ${(keys[p.id] || p.noKey) ? (paused ? 'ko' : 'ok') : ''}"></span>
        <span class="name">${i+1}. ${p.name}</span>
        <button data-up="${i}">↑</button><button data-down="${i}">↓</button>
        <input type="checkbox" data-en="${i}" ${p.enabled ? 'checked' : ''}>
      </div>
      <input type="password" placeholder="${p.noKey ? 'Clé API (facultative)' : 'Clé API'}" data-key="${p.id}" value="${esc(keys[p.id] || '')}">
      <div class="row"><input type="text" placeholder="Modèle" data-model="${i}" value="${esc(p.model)}"><button data-def="${i}" title="Modèle par défaut" style="margin-top:8px">↺</button></div>
      <div class="hint">${p.help}${paused ? '<br>⏸ En pause jusqu\'à ' + new Date(cooldown[p.id]).toLocaleTimeString() : ''}</div>`;
    list.appendChild(div);
  });
  $('sysPrompt').value = systemPrompt; $('profName').textContent = PROFILES[profile].name;
}
$('provList').addEventListener('click', e => {
  const up = e.target.dataset.up, down = e.target.dataset.down;
  const def = e.target.dataset.def;
  if (def !== undefined) { const d = DEFAULT_PROVIDERS.find(x => x.id === providers[+def].id); providers[+def].model = d.model; persist(); renderSettings(); return; }
  if (up !== undefined && +up > 0) { [providers[+up-1], providers[+up]] = [providers[+up], providers[+up-1]]; persist(); renderSettings(); }
  if (down !== undefined && +down < providers.length-1) { [providers[+down+1], providers[+down]] = [providers[+down], providers[+down+1]]; persist(); renderSettings(); }
});
$('provList').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.en !== undefined) providers[+t.dataset.en].enabled = t.checked;
  if (t.dataset.key) { keys[t.dataset.key] = t.value.trim(); delete cooldown[t.dataset.key]; }
  if (t.dataset.model !== undefined) { const v = t.value.trim(); providers[+t.dataset.model].model = badModel(v) ? DEFAULT_PROVIDERS.find(x => x.id === providers[+t.dataset.model].id).model : v; }
  persist();
});
$('sysPrompt').addEventListener('change', e => { const v = e.target.value.trim(); if (v && v !== PROFILES[profile].prompt) prompts[profile] = v; else delete prompts[profile]; systemPrompt = v || PROFILES[profile].prompt; persist(); });
$('btnPromptReset').onclick = () => { delete prompts[profile]; systemPrompt = PROFILES[profile].prompt; persist(); renderSettings(); };
const sel = $('profile');
Object.entries(PROFILES).forEach(([k, v]) => { const o = document.createElement('option'); o.value = k; o.textContent = v.name; sel.appendChild(o); });
sel.value = profile;
sel.onchange = () => { persist(); profile = sel.value; systemPrompt = prompts[profile] || PROFILES[profile].prompt; history = histories[profile] || []; persist(); render(); };
$('btnSettings').onclick = () => { renderSettings(); $('settings').classList.add('open'); };
$('btnClose').onclick = () => $('settings').classList.remove('open');
$('btnReset').onclick = () => { cooldown = {}; persist(); renderSettings(); };
$('btnNew').onclick = () => { history = []; persist(); render(); };

// ---------- Saisie ----------
function autosize(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); send(); } });
$('btnSend').onclick = send;

render();
</script>
</body>
</html>
