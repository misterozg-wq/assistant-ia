<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistant IA</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Assistant IA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#181b22">
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --txt:#e8eaef; --mut:#8b93a3; --acc:#4f8cff; --usr:#2b5cd6; --ok:#2fbf71; --ko:#e5534b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  header { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:17px; margin:0; flex:1; }
  #status { font-size:12px; color:var(--mut); }
  button { background:var(--line); color:var(--txt); border:0; border-radius:10px; padding:8px 12px; font-size:15px; }
  button.primary { background:var(--acc); color:#fff; }
  #chat { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 12px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--usr); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bot pre { background:#0a0c10; padding:8px; border-radius:8px; overflow-x:auto; white-space:pre; }
  .tag { display:block; font-size:11px; color:var(--mut); margin-top:6px; }
  .sys { align-self:center; font-size:12px; color:var(--mut); text-align:center; }
  footer { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); background:var(--panel); }
  textarea { flex:1; resize:none; background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:12px; padding:10px; font:inherit; max-height:140px; }
  #settings { position:fixed; inset:0; background:var(--bg); overflow-y:auto; padding:16px; padding-top:calc(16px + env(safe-area-inset-top)); display:none; }
  #settings.open { display:block; }
  .prov { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .prov .row { display:flex; align-items:center; gap:8px; }
  .prov .name { flex:1; font-weight:600; }
  .prov input[type=text], .prov input[type=password], #sysPrompt { width:100%; margin-top:8px; background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; font-size:14px; }
  .hint { font-size:12px; color:var(--mut); margin-top:6px; }
  .hint a { color:var(--acc); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--mut); }
  .mem { display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .mem span { flex:1; } .mem small { color:var(--mut); }
  #btnMic.on { background:var(--ko); color:#fff; }
  .say { background:none; padding:0 0 0 8px; font-size:13px; color:var(--mut); }
  #attBar { display:none; gap:6px; padding:6px 10px 0; flex-wrap:wrap; background:var(--panel); }
  #attBar.on { display:flex; }
  .chip { display:flex; align-items:center; gap:4px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:3px 6px; font-size:12px; max-width:48%; }
  .chip img { width:40px; height:40px; object-fit:cover; border-radius:6px; }
  .chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip button { padding:2px 6px; font-size:12px; }
  .att { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:4px; }
  .att img { max-width:160px; max-height:160px; border-radius:8px; }
  .att .f { font-size:12px; background:rgba(0,0,0,.2); border-radius:6px; padding:2px 6px; }
  #attMenu { position:fixed; bottom:calc(70px + env(safe-area-inset-bottom)); left:10px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px; display:none; flex-direction:column; gap:6px; z-index:5; }
  #attMenu.on { display:flex; }
  .dot.ok { background:var(--ok); } .dot.ko { background:var(--ko); }
</style>
</head>
<body>
<div id="app">
  <header>
    <select id="profile" style="flex:1;background:var(--panel);color:var(--txt);border:0;font-size:17px;font-weight:600;min-width:0"></select>
    <span id="status"></span>
    <button id="btnVoice" data-i18n-title="t_voice">🔇</button>
    <button id="btnNew" data-i18n-title="t_new">＋</button>
    <button id="btnSettings" data-i18n-title="t_settings">⚙</button>
  </header>
  <div id="chat"></div>
  <div id="attBar"></div>
  <div id="attMenu"><button id="attCam" data-i18n="att_photo"></button><button id="attFile" data-i18n="att_file"></button></div>
  <input type="file" id="fileCam" accept="image/*" capture="environment" style="display:none">
  <input type="file" id="fileAny" accept="image/*,.pdf,.docx,.txt,.csv,.md,.json,.xml,.html,.htm,.rtf,text/*" multiple style="display:none">
  <footer>
    <button id="btnAtt" data-i18n-title="attach">📎</button>
    <textarea id="input" rows="1" data-i18n-ph="ph"></textarea>
    <button id="btnMic" data-i18n-title="t_mic">🎤</button>
    <button id="btnSend" class="primary">➤</button>
  </footer>
</div>

<div id="settings">
  <div style="display:flex;align-items:center;margin-bottom:12px">
    <h2 style="flex:1;margin:0;font-size:19px" data-i18n="settings"></h2>
    <button id="btnClose" class="primary">OK</button>
  </div>
  <div class="prov">
    <div class="name" data-i18n="lang_t"></div>
    <select id="langSel" style="width:100%;margin-top:8px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:15px"></select>
  </div>
  <p class="hint" data-i18n="set_hint"></p>
  <div id="provList"></div>
  <div class="prov">
    <div class="name" id="instrTitle"></div>
    <textarea id="sysPrompt" rows="10"></textarea>
    <button id="btnPromptReset" style="margin-top:8px" data-i18n="instr_reset"></button>
  </div>
  <div class="prov">
    <div class="name" data-i18n="voice_t"></div>
    <div class="row"><select id="ttsVoice" style="flex:1;margin-top:8px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px"></select><button id="ttsTest" style="margin-top:8px" data-i18n="test"></button></div>
    <div class="hint" data-i18n="voice_hint"></div>
  </div>
  <div class="prov">
    <div class="name" data-i18n="mem_t"></div>
    <div class="hint" data-i18n="mem_hint"></div>
    <div id="memList"></div>
    <div class="row"><input type="text" id="memNew" data-i18n-ph="mem_ph"><button id="memAdd" style="margin-top:8px">＋</button></div>
    <button id="memClear" style="margin-top:8px" data-i18n="mem_clear"></button>
  </div>
  <button id="btnReset" data-i18n="quota_reset"></button>
</div>

const MEM_MAX = 150;
const MEM_INSTR = "\n\n---\nMÉMOIRE : tu disposes d'une mémoire persistante sur l'utilisateur. Quand il te donne une information durable (fait le concernant, client, dossier, préférence, tâche à faire, échéance) ou te demande de retenir quelque chose, ajoute à la toute fin de ta réponse une ligne par élément au format exact [MÉMO: texte court et autonome, avec la date si utile]. Quand une tâche est terminée ou qu'il demande d'oublier quelque chose, ajoute [OUBLI: texte de l'élément concerné]. N'ajoute ces lignes que si c'est utile, n'en parle pas dans ta réponse et ne mémorise pas de mots de passe ni de numéros bancaires.";
function memBlock() {
  if (!memory.length) return '';
  return "\n\nCe que tu sais déjà de l'utilisateur (mémoire, du plus ancien au plus récent) :\n" + memory.map(m => '- ' + m.t + (m.d ? ' (noté le ' + m.d + ')' : '')).join('\n');
}
const norm = x => x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function memAddItem(t) {
  t = t.trim(); if (!t) return false;
  if (memory.some(m => norm(m.t) === norm(t))) return false;
  memory.push({ t, d: new Date().toLocaleDateString('fr-FR') });
  if (memory.length > MEM_MAX) memory = memory.slice(-MEM_MAX);
  return true;
}
function memForget(t) {
  const n = norm(t); const before = memory.length;
  memory = memory.filter(m => { const k = norm(m.t); return !(k === n || k.includes(n) || n.includes(k)); });
  return before !== memory.length;
}
function extractMemory(content) {
  const added = [], removed = [];
  const clean = content.replace(/\[\s*(M[ÉE]MO|OUBLI)\s*:\s*([^\]]+)\]/gi, (_, kind, txt) => {
    if (/^oubli/i.test(kind)) { if (memForget(txt)) removed.push(txt.trim()); }
    else if (memAddItem(txt)) added.push(txt.trim());
    return '';
  }).replace(/\n{3,}/g, '\n\n').trim();
  return { clean, added, removed };
}

function mergeProviders(saved) {

  DEFAULT_PROVIDERS.forEach(p => { if (!out.find(o => o.id === p.id)) out.push({...p}); });

}

function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function md(s){
  let h = esc(s);
  h = h.replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, c) => '<pre>' + c + '</pre>');
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');

}
function addMsg(role, text, by, att) {

function classify(status, body) {
  const b = (body || '').toLowerCase();
  if (status === 429 || b.includes('quota') || b.includes('rate limit') || b.includes('resource_exhausted')) return {reason:T('r_limit'), wait: 15*60*1000};
  if (status === 402 || b.includes('insufficient') || b.includes('credit') || b.includes('balance')) return {reason:T('r_credit'), wait: 6*3600*1000};
  if (status === 401 || status === 403) return {reason:T('r_key'), wait: 0};
  if (status >= 500) return {reason:T('r_down'), wait: 2*60*1000};
  if (status === 0) return {reason:T('r_net'), wait: 0};
  if (status === 404) return {reason:T('r_404') + ' (⚙)', wait: 0};
  return {reason:T('r_err') + ' ' + status, wait: 0};
}

async function callProvider(p, messages) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  try {
    const r = await fetch(p.url, {
      method:'POST', signal: ctrl.signal,
      headers: Object.assign({ 'Content-Type':'application/json' }, (keys[p.id] || p.anonKey) ? { 'Authorization':'Bearer ' + (keys[p.id] || p.anonKey) } : {}),
      body: JSON.stringify({ model:p.model, messages, temperature:0.7 })
    });
    const txt = await r.text();
    if (!r.ok) return { ok:false, status:r.status, body:txt };
    const j = JSON.parse(txt);
    const content = j.choices?.[0]?.message?.content;
    if (!content) return { ok:false, status:500, body:T('r_empty') };
    return { ok:true, content };
  } catch (e) {
    return { ok:false, status:0, body:String(e) };
  } finally { clearTimeout(timer); }
}

function userContent(text, images, docs) {
  let t = text;

  if (!images || !images.length) return t;
  return [{ type:'text', text:t }, ...images.map(u => ({ type:'image_url', image_url:{ url:u } }))];

async function ask(userText, images, docs) {
  const hist = history.slice(-20);
  const withImg = !!(images && images.length) || hist.slice(-6).some(m => m.images && m.images.length);
  const messages = [{role:'system', content:systemPrompt + MEM_INSTR + memBlock() + '\n\n---\nLANGUE / LANGUAGE : réponds toujours en ' + LANG_DIRECTIVE[lang] + ', même si les instructions ci-dessus sont rédigées dans une autre langue. Si l\'utilisateur t\'écrit clairement dans une autre langue, réponds dans sa langue.'},
    ...hist.map((m, i) => ({ role:m.role, content: (m.role === 'user' && i >= hist.length - 6 && (m.images || m.docs)) ? userContent(m.content, m.images, m.docs) : m.content })),
    {role:'user', content:userContent(userText, images, docs)}];
  const now = Date.now();
  const candidates = providers.filter(p => p.enabled && (keys[p.id] || p.noKey) && (!withImg || p.vision));
  if (!candidates.length) return { error: withImg ? T('att_no_vision') : T('no_ai') };

  // D'abord ceux qui ne sont pas en pause, puis ceux en pause en dernier recours
  const ordered = [...candidates.filter(p => !(cooldown[p.id] > now)), ...candidates.filter(p => cooldown[p.id] > now)];
  const notes = [];
  for (const p of ordered) {
    setStatus(p.name + '…');
    const res = await callProvider(p, messages);
    if (res.ok) { delete cooldown[p.id]; persist(); setStatus(''); return { content:res.content, by:p.name, notes }; }
    const c = classify(res.status, res.body);
    if (c.wait) cooldown[p.id] = Date.now() + c.wait;
    let detail = ''; try { const j = JSON.parse(res.body); detail = (Array.isArray(j) ? j[0] : j)?.error?.message || ''; } catch {}
    notes.push(p.name + ' : ' + c.reason + (detail ? ' (' + detail.slice(0,120) + ')' : '') + ' → ' + T('switch'));
    persist();
  }
  setStatus('');

}

      <input type="password" placeholder="${p.noKey ? T('key_opt') : T('key')}" data-key="${p.id}" value="${esc(keys[p.id] || '')}">

      <div class="hint">${T(p.help).replace('{l}', '<a href="' + p.link + '" target="_blank">' + p.link.replace(/^https:\/\//, '') + '</a>')}${paused ? '<br>⏸ ' + T('paused') + ' ' + new Date(cooldown[p.id]).toLocaleTimeString() : ''}</div>`;
    list.appendChild(div);
  });
  $('sysPrompt').value = systemPrompt; $('instrTitle').textContent = T('instr').replace('{p}', T(PROFILES[profile].nameKey));
}
$('provList').addEventListener('click', e => {
  const up = e.target.dataset.up, down = e.target.dataset.down;
  const def = e.target.dataset.def;
  if (def !== undefined) { const d = DEFAULT_PROVIDERS.find(x => x.id === providers[+def].id); providers[+def].model = d.model; persist(); renderSettings(); return; }
  if (up !== undefined && +up > 0) { [providers[+up-1], providers[+up]] = [providers[+up], providers[+up-1]]; persist(); renderSettings(); }
  if (down !== undefined && +down < providers.length-1) { [providers[+down+1], providers[+down]] = [providers[+down], providers[+down+1]]; persist(); renderSettings(); }
});
$('provList').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.en !== undefined) providers[+t.dataset.en].enabled = t.checked;
  if (t.dataset.key) { keys[t.dataset.key] = t.value.trim(); delete cooldown[t.dataset.key]; }
  if (t.dataset.model !== undefined) { const v = t.value.trim(); providers[+t.dataset.model].model = badModel(v) ? DEFAULT_PROVIDERS.find(x => x.id === providers[+t.dataset.model].id).model : v; }
  persist();
});
$('sysPrompt').addEventListener('change', e => { const v = e.target.value.trim(); if (v && v !== PROFILES[profile].prompt) prompts[profile] = v; else delete prompts[profile]; systemPrompt = v || PROFILES[profile].prompt; persist(); });
$('btnPromptReset').onclick = () => { delete prompts[profile]; systemPrompt = PROFILES[profile].prompt; persist(); renderSettings(); };
const sel = $('profile');
function fillProfiles() { sel.innerHTML = ''; Object.entries(PROFILES).forEach(([k, v]) => { const o = document.createElement('option'); o.value = k; o.textContent = T(v.nameKey); sel.appendChild(o); }); sel.value = profile; }
fillProfiles();
sel.value = profile;
sel.onchange = () => { persist(); profile = sel.value; systemPrompt = prompts[profile] || PROFILES[profile].prompt; history = histories[profile] || []; persist(); render(); };
$('btnSettings').onclick = () => { renderSettings(); $('settings').classList.add('open'); };
$('btnClose').onclick = () => $('settings').classList.remove('open');
$('memList').addEventListener('click', e => { const i = e.target.dataset.memdel; if (i !== undefined) { memory.splice(+i, 1); persist(); renderMemory(); } });
$('memAdd').onclick = () => { if (memAddItem($('memNew').value)) { $('memNew').value = ''; persist(); renderMemory(); } };
$('memClear').onclick = () => { if (memory.length && window.confirm(T('mem_confirm'))) { memory = []; persist(); renderMemory(); } };
$('btnReset').onclick = () => { cooldown = {}; persist(); renderSettings(); };
$('btnNew').onclick = () => { history = []; persist(); render(); };

// ---------- Voix ----------
const CAP = window.Capacitor;
const IS_APP = !!(CAP && ((CAP.isNativePlatform && CAP.isNativePlatform()) || (CAP.getPlatform && CAP.getPlatform() !== 'web')));
function hasNative(n) {
  if (!IS_APP) return false;
  if (CAP.Plugins && CAP.Plugins[n]) return true;
  return !!(CAP.nativePromise && (!CAP.PluginHeaders || CAP.PluginHeaders.some(h => h.name === n)));
}
function nat(p, m, o) {
  if (CAP.Plugins && CAP.Plugins[p] && CAP.Plugins[p][m]) return CAP.Plugins[p][m](o || {});
  return CAP.nativePromise(p, m, o || {});
}
const NativeSR = hasNative('SpeechRecognition'), NativeTTS = hasNative('TextToSpeech');
const WebSR = !IS_APP && (window.SpeechRecognition || window.webkitSpeechRecognition);
const VOICE_IDS = { nova:'v_f', shimmer:'v_f', alloy:'v_n', echo:'v_m', onyx:'v_deep', fable:'', device:'' };
const VOICES = VOICE_IDS;
const voiceLabel = k => k === 'device' ? T('v_dev') : T('natural') + ' – ' + k[0].toUpperCase() + k.slice(1) + (VOICE_IDS[k] ? ' (' + T(VOICE_IDS[k]) + ')' : '');
let ttsVoice = load('ttsVoice', 'nova'); if (!VOICES[ttsVoice]) ttsVoice = 'nova';
let autoSpeak = load('autoSpeak', false);
const player = new Audio(); player.preload = 'auto';
let audioUnlocked = false, speakToken = 0, onlineFailed = false;
function silentWav() {
  const n = 800, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = (o, t) => [...t].forEach((c, i) => b[o + i] = c.charCodeAt(0));
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
  let bin = ''; b.forEach(x => bin += String.fromCharCode(x)); return 'data:audio/wav;base64,' + btoa(bin);
}
function unlockAudio() {   // iPhone : autorise la lecture audio après un geste de l'utilisateur
  if (audioUnlocked) return; audioUnlocked = true;
  try { player.src = silentWav();
    const pr = player.play(); if (pr) pr.catch(() => {});
  } catch {}
}
function plain(t) { return t.replace(/```[\s\S]*?```/g, ' (bloc de code) ').replace(/[*_#`>|]/g, '').replace(/\[(.*?)\]\(.*?\)/g, '$1').replace(/\n+/g, '. ').replace(/(\.\s*){2,}/g, '. ').trim(); }
function chunks(t, max) {
  const parts = t.match(/[^.!?;:]+[.!?;:]*\s*/g) || [t]; const out = []; let cur = '';
  for (const p of parts) { if ((cur + p).length > max && cur) { out.push(cur.trim()); cur = ''; } cur += p; while (cur.length > max) { out.push(cur.slice(0, max)); cur = cur.slice(max); } }
  if (cur.trim()) out.push(cur.trim()); return out;
}
function playUrl(url, token) {
  return new Promise((res, rej) => {
    if (token !== speakToken) return res();
    player.onended = () => res(); player.onerror = () => rej(new Error('audio'));
    player.src = url; const pr = player.play(); if (pr) pr.catch(rej);
  });
}
async function speakOnline(t, token) {
  const key = keys.pollinations || (DEFAULT_PROVIDERS.find(p => p.id === 'pollinations') || {}).anonKey || '';
  for (const c of chunks(t, 380)) {
    if (token !== speakToken) return;
    const url = 'https://gen.pollinations.ai/audio/' + encodeURIComponent(c) + '?voice=' + ttsVoice + (key ? '&key=' + encodeURIComponent(key) : '');
    await playUrl(url, token);
  }
}
async function speakDevice(t) {
  if (NativeTTS) { await nat('TextToSpeech', 'speak', { text: t, lang: I18N[lang].bcp, rate: 1.0, pitch: 1.0, volume: 1.0, category: 'playback' }); return; }
  if (window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance(t); u.lang = I18N[lang].bcp;
    const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith(lang));
    const v = vs.find(v => /natural|neural|premium|enhanced|google/i.test(v.name)) || vs[0]; if (v) u.voice = v;
    speechSynthesis.speak(u); return;
  }
  throw new Error(T('tts_fail'));
}
async function stopSpeak() {
  speakToken++;
  try { player.pause(); } catch {}
  try { if (NativeTTS) await nat('TextToSpeech', 'stop'); else if (window.speechSynthesis) speechSynthesis.cancel(); } catch {}
}
async function speak(text) {
  await stopSpeak(); const token = speakToken; const t = plain(text); if (!t) return;
  if (ttsVoice !== 'device' && !onlineFailed) {
    try { await speakOnline(t, token); return; }
    catch (e) { if (token !== speakToken) return; onlineFailed = true; addMsg('sys', T('online_fail')); setTimeout(() => { onlineFailed = false; }, 10 * 60 * 1000); }
  }
  try { await speakDevice(t); } catch (e) { addMsg('sys', T('tts_fail') + ' ' + (e.message || e)); }
}
function setVoiceBtn() { $('btnVoice').textContent = autoSpeak ? '🔊' : '🔇'; }
$('btnVoice').onclick = () => { unlockAudio(); autoSpeak = !autoSpeak; save('autoSpeak', autoSpeak); setVoiceBtn(); if (!autoSpeak) stopSpeak(); addMsg('sys', autoSpeak ? T('auto_on') : T('auto_off')); };
setVoiceBtn();
(function () {
  const sel = $('ttsVoice');
  window.fillVoices = () => { sel.innerHTML = ''; Object.keys(VOICES).forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = voiceLabel(k); sel.appendChild(o); }); sel.value = ttsVoice; };
  fillVoices();
  sel.value = ttsVoice;
  sel.onchange = () => { ttsVoice = sel.value; save('ttsVoice', ttsVoice); onlineFailed = false; };
  $('ttsTest').onclick = () => { unlockAudio(); speak(T('tts_sample')); };
})();

let listening = false, webRec = null;
function micState(on) { listening = on; $('btnMic').classList.toggle('on', on); }
async function listen() {
  unlockAudio();
  if (listening) { try { if (webRec) webRec.stop(); if (NativeSR) await nat('SpeechRecognition', 'stop'); } catch {} micState(false); return; }
  await stopSpeak();
  try {
    if (NativeSR) {
      const av = await nat('SpeechRecognition', 'available');
      if (av && av.available === false) throw new Error(T('sr_unavail'));
      let perm = await nat('SpeechRecognition', 'checkPermissions').catch(() => null);
      if (!perm || perm.speechRecognition !== 'granted') perm = await nat('SpeechRecognition', 'requestPermissions');
      if (perm && perm.speechRecognition && perm.speechRecognition !== 'granted') throw new Error(T('mic_denied'));
      micState(true);
      const res = await nat('SpeechRecognition', 'start', { language: I18N[lang].bcp, maxResults: 1, prompt: T('speak_prompt'), partialResults: false, popup: true });
      micState(false);
      const txt = res && res.matches && res.matches[0];
      if (txt) { input.value = txt; autosize(); send(); }
      return;
    }
    if (WebSR) {
      webRec = new WebSR(); webRec.lang = I18N[lang].bcp; webRec.interimResults = true; webRec.maxAlternatives = 1;
      let finalTxt = '';
      webRec.onresult = e => { let t = ''; for (const r of e.results) { t += r[0].transcript; if (r.isFinal) finalTxt = t; } input.value = t; autosize(); };
      webRec.onerror = e => { micState(false); if (e.error !== 'no-speech' && e.error !== 'aborted') addMsg('sys', T('mic') + ' ' + (e.error === 'not-allowed' ? T('mic_br_denied') : e.error)); };
      webRec.onend = () => { micState(false); if (finalTxt.trim()) send(); };
      micState(true); webRec.start(); return;
    }
    addMsg('sys', T('sr_none'));
  } catch (e) { micState(false); addMsg('sys', T('mic') + ' ' + (e.message || e)); }
}
$('btnMic').onclick = listen;

// ---------- Pièces jointes ----------
let pending = [];
const MAX_FILE = 25 * 1024 * 1024, MAX_TEXT = 40000;
function renderAtt() {
  const bar = $('attBar'); bar.innerHTML = ''; bar.classList.toggle('on', pending.length > 0);
  pending.forEach((a, i) => {
    const c = document.createElement('div'); c.className = 'chip';
    c.innerHTML = (a.thumb ? '<img src="' + a.thumb + '">' : '📄') + '<span>' + esc(a.name) + '</span><button data-attdel="' + i + '">✕</button>';
    bar.appendChild(c);
  });
}
$('attBar').addEventListener('click', e => { const i = e.target.dataset.attdel; if (i !== undefined) { pending.splice(+i, 1); renderAtt(); } });
function readAs(file, how) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr[how](file); }); }
function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
function resize(im, max, q) {
  const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas');
  c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function pdfText(buf) {
  const pdfjs = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
  const doc = await pdfjs.getDocument({ data: buf }).promise; let out = '';
  for (let i = 1; i <= doc.numPages && out.length < MAX_TEXT; i++) { const pg = await doc.getPage(i); const tc = await pg.getTextContent(); out += tc.items.map(x => x.str).join(' ') + '\n'; }
  return out;
}
async function docxText(buf) {
  if (!window.mammoth) await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js');
  return (await window.mammoth.extractRawText({ arrayBuffer: buf })).value;
}
async function addFiles(files) {
  for (const f of files) {
    try {
      if (f.size > MAX_FILE) { addMsg('sys', T('att_too_big') + ' ' + f.name); continue; }
      const name = f.name || 'photo.jpg', ext = (name.split('.').pop() || '').toLowerCase();
      if ((f.type || '').startsWith('image/') || ['jpg','jpeg','png','webp','gif','heic','bmp'].includes(ext)) {
        const im = await loadImg(await readAs(f, 'readAsDataURL'));
        pending.push({ kind:'image', name, data: resize(im, 1280, 0.82), thumb: resize(im, 160, 0.7) });
      } else {
        setStatus(name + '…'); let text = '';
        if (ext === 'pdf' || f.type === 'application/pdf') text = await pdfText(await readAs(f, 'readAsArrayBuffer'));
        else if (ext === 'docx') text = await docxText(await readAs(f, 'readAsArrayBuffer'));
        else if ((f.type || '').startsWith('text/') || ['txt','csv','md','json','xml','html','htm','rtf','log'].includes(ext)) text = await readAs(f, 'readAsText');
        else { setStatus(''); addMsg('sys', T('att_unsupported') + ' ' + name); continue; }
        setStatus('');
        text = (text || '').replace(/[ \t]+/g, ' ').trim();
        if (text.length > MAX_TEXT) text = text.slice(0, MAX_TEXT) + '\n' + T('att_trunc');
        pending.push({ kind:'file', name, text });
      }
    } catch (e) { setStatus(''); addMsg('sys', T('att_fail') + ' ' + (f.name || '') + ' (' + (e && e.message || e) + ')'); }
  }
  renderAtt();
}
$('btnAtt').onclick = e => { e.stopPropagation(); $('attMenu').classList.toggle('on'); };
document.addEventListener('click', e => { if (!e.target.closest('#attMenu')) $('attMenu').classList.remove('on'); });
$('attCam').onclick = () => { $('attMenu').classList.remove('on'); $('fileCam').click(); };
$('attFile').onclick = () => { $('attMenu').classList.remove('on'); $('fileAny').click(); };
['fileCam', 'fileAny'].forEach(id => $(id).addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) addFiles(fs); }));

// ---------- Saisie ----------
function autosize(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); send(); } });
$('btnSend').onclick = () => { unlockAudio(); send(); };

(function () {
  const ls = $('langSel');
  Object.entries(I18N).forEach(([k, v]) => { const o = document.createElement('option'); o.value = k; o.textContent = v.name; ls.appendChild(o); });
  ls.value = lang;
  ls.onchange = () => { lang = ls.value; save('lang', lang); applyI18n(); fillProfiles(); fillVoices(); renderSettings(); render(); };
})();
applyI18n();
render();
</script>
