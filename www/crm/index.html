<style>
:root{--bg:#f3f5f9;--side:#14213d;--side2:#1d2f55;--acc:#2563eb;--acc2:#1d4ed8;--txt:#1e293b;--mut:#64748b;--line:#e2e8f0;--card:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,system-ui,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
a{color:var(--acc);text-decoration:none}
#app{display:flex;min-height:100vh}
#side{width:220px;background:var(--side);color:#cbd5e1;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
#side h1{font-size:18px;color:#fff;margin:0;padding:18px 18px 14px;border-bottom:1px solid var(--side2)}
#side nav a{display:flex;gap:10px;align-items:center;color:#cbd5e1;padding:11px 18px;border-left:3px solid transparent}
#side nav a:hover{background:var(--side2);color:#fff}#side nav a.on{background:var(--side2);color:#fff;border-left-color:#60a5fa}
#side .foot{margin-top:auto;padding:14px 18px;font-size:12px;border-top:1px solid var(--side2)}
#wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;gap:14px;align-items:center;position:sticky;top:0;z-index:20}
#search{position:relative;flex:1;max-width:620px}
#search input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#f8fafc}
#search:before{content:"🔍";position:absolute;left:11px;top:9px;font-size:14px;opacity:.6}
#sres{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px #0002;max-height:440px;overflow:auto;display:none}
#sres div{padding:9px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer}#sres div:hover,#sres div.sel{background:#eff6ff}
#sres small{color:var(--mut)}
#sync{font-size:12px;color:var(--mut);white-space:nowrap}
#main{padding:22px;max-width:1400px;width:100%}
.btn{border:1px solid var(--line);background:#fff;color:var(--txt);padding:8px 13px;border-radius:7px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#94a3b8}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{background:var(--acc2)}
.btn.d{color:var(--bad)}.btn.s{padding:4px 8px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
h2{margin:0 0 16px;font-size:21px}h3{margin:0 0 12px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}.kpi b{display:block;font-size:22px;margin-top:4px}.kpi span{color:var(--mut);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;background:#f8fafc;position:sticky;top:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:#f8fafc}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.bdg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:#e2e8f0;color:#334155}
.b-ok{background:#dcfce7;color:#166534}.b-warn{background:#fef3c7;color:#92400e}.b-bad{background:#fee2e2;color:#991b1b}.b-info{background:#dbeafe;color:#1e40af}
.cp{cursor:pointer;border-bottom:1px dashed #cbd5e1}.cp:hover{background:#eff6ff;border-bottom-color:var(--acc)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 18px}
.fld{padding:8px 0;border-bottom:1px solid #f1f5f9;display:flex;gap:8px;align-items:baseline}
.fld label{color:var(--mut);font-size:12px;width:120px;flex-shrink:0}.fld .v{flex:1;word-break:break-word}
.ic{cursor:pointer;opacity:.5;font-size:13px;border:none;background:none;padding:0 2px}.ic:hover{opacity:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}

input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;width:100%;background:#fff}
textarea{min-height:80px;resize:vertical}

.jr{border-left:3px solid #bfdbfe;padding:6px 12px;margin:8px 0}.jr small{color:var(--mut)}
code{background:#f1f5f9;padding:1px 5px;border-radius:4px}
ol li{margin-bottom:6px}

<script>
/* ================= UTILITAIRES ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const digits=s=>String(s??'').replace(/\D/g,'');
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const fr=d=>{if(!d)return'';const x=d instanceof Date?d:new Date(d+'T00:00');return isNaN(x)?String(d):x.toLocaleDateString('fr-FR')};
const iso=d=>{const x=new Date(d);return isNaN(x)?'':x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const num=v=>{if(v===''||v==null)return 0;const n=parseFloat(String(v).replace(/\s/g,'').replace('€','').replace(',','.'));return isNaN(n)?0:n};
const eur=v=>(v===''||v==null)?'':num(v).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
async function copyText(t){t=String(t??'');try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Copié : '+(t.length>50?t.slice(0,50)+'…':t))}
const cp=(v,disp)=>v===''||v==null?'<span class="muted">—</span>':`<span class="cp" data-copy="${esc(v)}" title="Cliquer pour copier">${esc(disp??v)}</span>`;
document.addEventListener('click',e=>{const c=e.target.closest('[data-copy]');if(c){e.stopPropagation();copyText(c.dataset.copy)}},true);
function loadScript(urls){return new Promise((res,rej)=>{const tryN=i=>{if(i>=urls.length)return rej(new Error('Chargement impossible : '+urls[0]));const s=document.createElement('script');s.src=urls[i];s.onload=res;s.onerror=()=>{s.remove();tryN(i+1)};document.head.appendChild(s)};tryN(0)})}

/* ================= LISTES DE RÉFÉRENCE ================= */
const COMPAGNIES=['Abeille Vie','AIG','Airbag','Allianz','AMI3F','April','AREAS','Assurmax','AXA','BHL Développement (Accelerant)','Ergo','Generali','Kereis','Leader','Luxior','Malakoff Humanis','MALJ','Matrisk','Maxance','MMA','Solly Azar','Spring','Swiss Life','Tetris'];
const BRANCHES=['Santé','Prévoyance','Multirisque professionnelle (MRP)','RC Professionnelle','RC Décennale','Dommage ouvrage','Habitation','Auto','Flotte auto','Auto entreprise','Emprunteur','Épargne / Retraite','Protection juridique','Autre'];
const ST_CT=['En cours','En attente','Suspendu','Résilié','Sans effet'];
const ST_SIN=['Ouvert','En expertise','En attente de pièces','Réglé','Clos','Refusé'];

const F={
 client:[
  {k:'statut',l:'Statut',t:'select',o:['Client','Prospect','Ancien client']},
  {k:'type',l:'Type',t:'select',o:['Professionnel','Particulier']},
  {k:'reference',l:'Référence client'},
  {k:'civilite',l:'Civilité',t:'select',o:['','M.','Mme','Société']},
  {k:'nom',l:'Nom / Raison sociale',req:1},
  {k:'prenom',l:'Prénom'},
  {k:'formeJuridique',l:'Forme juridique'},
  {k:'gerant',l:'Gérant / Contact'},
  {k:'dateNaissance',l:'Date de naissance',t:'date'},
  {k:'lieuNaissance',l:'Lieu de naissance'},
  {k:'siret',l:'SIRET / SIREN'},
  {k:'naf',l:'Code NAF'},
  {k:'activite',l:'Activité'},
  {k:'dateCreation',l:'Date de création',t:'date'},
  {k:'adresse',l:'Adresse'},{k:'cp',l:'Code postal'},{k:'ville',l:'Ville'},
  {k:'tel',l:'Téléphone'},{k:'tel2',l:'Téléphone 2'},{k:'email',l:'Email'},
  {k:'iban',l:'IBAN'},{k:'bic',l:'BIC'},

 contrat:[
  {k:'compagnie',l:'Compagnie',list:'dlComp',req:1},
  {k:'intermediaire',l:'Intermédiaire / Grossiste'},
  {k:'branche',l:'Branche',list:'dlBr'},
  {k:'produit',l:'Produit / Formule'},

  {k:'reference',l:'Réf. devis / interne'},
  {k:'dateEffet',l:"Date d'effet",t:'date'},
  {k:'echeance',l:'Échéance principale',t:'date'},
  {k:'dateResiliation',l:'Date de résiliation',t:'date'},
  {k:'fractionnement',l:'Fractionnement',t:'select',o:['','Annuel','Semestriel','Trimestriel','Mensuel']},
  {k:'primeTTC',l:'Prime annuelle TTC (€)',t:'number'},
  {k:'primeHT',l:'Prime annuelle HT (€)',t:'number'},
  {k:'tauxCom',l:'Taux de commission (%)',t:'number'},
  {k:'commission',l:'Commission annuelle (€)',t:'number'},
  {k:'fraisDossier',l:'Frais de dossier (€)',t:'number'},
  {k:'statut',l:'Statut',t:'select',o:ST_CT},
  {k:'notes',l:'Notes',t:'textarea',full:1}],
 sinistre:[
  {k:'contratId',l:'Contrat concerné',t:'contrat'},
  {k:'numero',l:'N° de sinistre'},
  {k:'dateSurvenance',l:'Date de survenance',t:'date'},
  {k:'dateDeclaration',l:'Date de déclaration',t:'date'},
  {k:'nature',l:'Nature (dégât des eaux, vol…)'},
  {k:'gestionnaire',l:'Gestionnaire compagnie'},

  {k:'montantEstime',l:'Montant estimé (€)',t:'number'},

  {k:'description',l:'Description / suivi',t:'textarea',full:1}],
 tache:[
  {k:'titre',l:'Tâche',req:1,full:1},
  {k:'clientId',l:'Client',t:'client'},

  {k:'priorite',l:'Priorité',t:'select',o:['Normale','Haute','Urgente']},
  {k:'notes',l:'Notes',t:'textarea',full:1}]
};

/* ================= STOCKAGE (local ou OneDrive) ================= */
const LKEY='crmgpc_data', CFG_ID='crmgpc_clientId', DEFAULT_CID='a97b0a70-9408-49f8-971a-384f434597ff';
const cfgId=()=>localStorage.getItem(CFG_ID)||DEFAULT_CID;
const REDIR=()=>location.origin+location.pathname.replace(/index\.html$/,'');
const ROOT='CRM_GPC', FILE=ROOT+'/crm-data.json';
const SCOPES=['User.Read','Files.ReadWrite'];
const empty=()=>({clients:[],contrats:[],sinistres:[],taches:[],deleted:{},v:1});
let D=empty(), MODE='local', ETAG=null, saveT=null, saving=false, pending=false;
let msalApp=null, account=null;

function setSync(s){const m={ok:'✓ Enregistré',saving:'⟳ Enregistrement…',err:'⚠ Erreur d\'enregistrement',load:'⟳ Chargement…'};$('#sync').innerHTML=(MODE==='onedrive'?'☁ OneDrive · ':'💾 Local · ')+(m[s]||s)}
function touch(o){o.updatedAt=Date.now();return o}
function dirty(){pending=true;clearTimeout(saveT);saveT=setTimeout(save,700);setSync('saving')}
function enc(p){return p.split('/').map(encodeURIComponent).join('/')}

async function initMsal(){
 const cid=cfgId();if(!cid||!location.protocol.startsWith('http'))return false;
 if(!window.msal) await loadScript(['https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js','https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js']);
 msalApp=new msal.PublicClientApplication({auth:{clientId:cid,authority:'https://login.microsoftonline.com/common',redirectUri:REDIR()},cache:{cacheLocation:'localStorage'}});
 if(msalApp.initialize) await msalApp.initialize();
 const r=await msalApp.handleRedirectPromise();
 account=r?r.account:(msalApp.getAllAccounts()[0]||null);
 return !!account;
}
async function login(){if(!location.protocol.startsWith('http'))return alert("La connexion OneDrive nécessite que la page soit ouverte depuis une adresse web (https://… ou http://localhost), pas en double-cliquant sur le fichier. Voir Paramètres.");try{if(!msalApp)await initMsal();if(!msalApp)return alert('Renseignez d\'abord l\'ID d\'application.');await msalApp.loginRedirect({scopes:SCOPES,prompt:'select_account'})}catch(e){alert('Connexion impossible : '+e.message)}}
async function logout(){if(msalApp&&account)await msalApp.logoutRedirect({account})}
async function token(){try{return (await msalApp.acquireTokenSilent({scopes:SCOPES,account})).accessToken}catch(e){await msalApp.acquireTokenRedirect({scopes:SCOPES,account})}}
async function G(path,opt={}){const t=await token();return fetch(path.startsWith('http')?path:'https://graph.microsoft.com/v1.0'+path,{...opt,headers:{Authorization:'Bearer '+t,...(opt.headers||{})}})}

function merge(a,b){const out=empty();out.deleted={...(a.deleted||{}),...(b.deleted||{})};
 for(const k of ['clients','contrats','sinistres','taches']){const m=new Map();for(const x of [...(a[k]||[]),...(b[k]||[])]){const p=m.get(x.id);if(!p||(x.updatedAt||0)>(p.updatedAt||0))m.set(x.id,x)}out[k]=[...m.values()].filter(x=>!out.deleted[x.id])}return out}

let LOADED=false;
async function loadRemote(){
 setSync('load');let m;
 for(let i=0;i<4;i++){m=await G(`/me/drive/root:/${enc(FILE)}?t=${Date.now()}`);console.log('[CRM] chargement OneDrive',m.status);if(m.ok)break;await new Promise(r=>setTimeout(r,1200*(i+1)))}
 if(m.status===404){const s=await G(`/me/drive/root/search(q='crm-data.json')`);const j=s.ok?await s.json():{value:[]};if((j.value||[]).some(x=>x.name==='crm-data.json'&&x.parentReference&&/CRM_GPC/.test(x.parentReference.path||'')))throw new Error('fichier présent mais illisible');ETAG=null;D=empty();LOADED=true;return}
 if(!m.ok)throw new Error('OneDrive '+m.status);
 const meta=await m.json();ETAG=meta.eTag;
 const r=await G(`/me/drive/items/${meta.id}/content`);if(!r.ok)throw new Error('Lecture '+r.status);D=Object.assign(empty(),await r.json());LOADED=true;
}
async function uploadBig(path,blob,conflict='replace'){
 const s=await G(`/me/drive/root:/${enc(path)}:/createUploadSession`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item:{'@microsoft.graph.conflictBehavior':conflict}})});
 if(!s.ok)throw new Error('Session '+s.status);const {uploadUrl}=await s.json();const CH=327680*20;let r;
 for(let i=0;i<blob.size;i+=CH){const part=blob.slice(i,Math.min(i+CH,blob.size));r=await fetch(uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes ${i}-${i+part.size-1}/${blob.size}`},body:part});if(!r.ok&&r.status!==202)throw new Error('Envoi '+r.status)}
 return r.json();
}
async function save(){
 if(saving){clearTimeout(saveT);saveT=setTimeout(save,500);return}
 saving=true;pending=false;
 try{
  if(MODE==='local'){localStorage.setItem(LKEY,JSON.stringify(D));setSync('ok');return}
  if(!LOADED){setSync('err');pending=true;toast('Données OneDrive non chargées : rechargez la page avant de modifier.');return}
  const body=JSON.stringify(D);let j;
  if(body.length>3800000){j=await uploadBig(FILE,new Blob([body],{type:'application/json'}))}
  else{const h={'Content-Type':'application/json'};if(ETAG)h['If-Match']=ETAG;
   const r=await G(`/me/drive/root:/${enc(FILE)}:/content`,{method:'PUT',headers:h,body});
   if(r.status===412){const mine=D;await loadRemote();D=merge(D,mine);saving=false;toast('Modifications d\'un autre poste fusionnées');route();return save()}
   if(!r.ok)throw new Error(r.status);j=await r.json()}
  ETAG=j.eTag;setSync('ok');
  try{localStorage.setItem('crmgpc_backup',JSON.stringify(D))}catch(e){}
 }catch(e){console.error(e);setSync('err');pending=true}
 finally{saving=false}
}
window.addEventListener('focus',async()=>{if(MODE!=='onedrive'||pending||saving)return;try{const m=await G(`/me/drive/root:/${enc(FILE)}?select=eTag`);if(m.ok){const j=await m.json();if(j.eTag!==ETAG){await loadRemote();route();setSync('ok');toast('Données actualisées')}}processInbox()}catch(e){}});
window.addEventListener('beforeunload',e=>{if(pending||saving){e.preventDefault();e.returnValue=''}});

/* ================= ACCÈS DONNÉES ================= */
const cli=id=>D.clients.find(c=>c.id===id);
const ctOf=id=>D.contrats.filter(c=>c.clientId===id);
const sinOf=id=>D.sinistres.filter(s=>s.clientId===id);
const tkOf=id=>D.taches.filter(t=>t.clientId===id);
const cname=c=>c?[c.nom,c.prenom].filter(Boolean).join(' '):'(client supprimé)';
function remove(coll,id){D[coll]=D[coll].filter(x=>x.id!==id);D.deleted[id]=Date.now();dirty()}
function nextEch(c){if(!c.echeance)return null;const d=new Date(c.echeance+'T00:00');if(isNaN(d))return null;const t=today();while(d<t)d.setFullYear(d.getFullYear()+1);return d}
const daysTo=d=>Math.round((d-today())/864e5);
const active=c=>(c.statut||'En cours')==='En cours';
function bStat(s){const m={'En cours':'b-ok','Client':'b-ok','Prospect':'b-info','Résilié':'b-bad','Ancien client':'b-bad','Sans effet':'b-bad','Suspendu':'b-warn','En attente':'b-warn','Ouvert':'b-warn','En expertise':'b-warn','En attente de pièces':'b-warn','Réglé':'b-ok','Clos':'b-ok','Refusé':'b-bad','Urgente':'b-bad','Haute':'b-warn'};return s?`<span class="bdg ${m[s]||''}">${esc(s)}</span>`:''}

/* ================= RECHERCHE GLOBALE ================= */
function searchAll(q,max=15){
 const n=norm(q),dg=digits(q);if(n.length<2)return[];const out=[];
 const hit=(...v)=>v.some(x=>x&&norm(x).includes(n));
 for(const c of D.clients){if(hit(cname(c),c.prenom+' '+c.nom,c.reference,c.siret,c.email,c.ville,c.gerant)||(dg.length>=4&&(digits(c.tel).includes(dg)||digits(c.tel2).includes(dg)||digits(c.siret).includes(dg))))out.push({t:'Client',l:cname(c),s:[c.reference,c.ville,c.tel].filter(Boolean).join(' · '),h:'#/client/'+c.id})}
 for(const k of D.contrats){if(hit(k.numero,k.reference,k.produit)){const c=cli(k.clientId);out.push({t:'Contrat',l:(k.numero||k.reference)+' — '+cname(c),s:[k.compagnie,k.branche].filter(Boolean).join(' · '),h:'#/client/'+k.clientId+'/contrats'})}}

 return out.slice(0,max);
}

 if(tab==='docs'){body=`<div class="drop" id="drop">📂 Glissez-déposez vos fichiers ici (CNI, Kbis, CP, devis, RIB…) ou <u>cliquez pour choisir</u><input type="file" id="fin" multiple hidden></div><div class="row" style="margin-bottom:6px"><label><input type="checkbox" id="anz" checked style="width:auto"> Analyser les documents déposés et mettre à jour la fiche (contrat, sinistre, coordonnées…)</label></div><div class="row" style="margin-bottom:10px"><span class="muted">Stockés dans OneDrive › ${esc(ROOT)}/Pieces_jointes</span><span class="sp"></span><button class="btn" onclick="openFolder('${id}')">Ouvrir le dossier OneDrive</button><button class="btn" onclick="listPJ('${id}')">⟳</button></div><div id="pjlist"></div>`;setTimeout(()=>{const d=$('#drop'),fi=$('#fin');d.onclick=()=>fi.click();fi.onchange=()=>uploadPJ(id,[...fi.files],$('#anz').checked);d.ondragover=e=>{e.preventDefault();d.classList.add('ov')};d.ondragleave=()=>d.classList.remove('ov');d.ondrop=e=>{e.preventDefault();d.classList.remove('ov');uploadPJ(id,[...e.dataTransfer.files],$('#anz').checked)};listPJ(id)})}
 if(tab==='journal')body=`<div class="card"><textarea id="jt" placeholder="Note d'appel, échange, info…"></textarea><div class="row" style="margin-top:8px"><span class="sp"></span><button class="btn p" onclick="addJ('${id}')">Ajouter au journal</button></div></div>${(c.journal||[]).slice().reverse().map((j,i)=>`<div class="jr"><small>${new Date(j.d).toLocaleString('fr-FR')}</small><div style="white-space:pre-wrap">${esc(j.t)}</div></div>`).join('')||'<p class="muted">Journal vide.</p>'}`;
 return `<div class="row" style="margin-bottom:6px"><a href="#/clients">← Clients</a></div>

const XLSX_URLS=['https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'];
async function needX(){if(!window.XLSX)await loadScript(XLSX_URLS)}
const fmtRow=(o,fs)=>{const r={};fs.forEach(f=>{let v=o[f.k];if(f.t==='date')v=fr(v);else if(f.t==='number'&&v!==''&&v!=null)v=num(v);r[f.l]=v??''});return r};
async function exportXLSX(ids){await needX();const set=ids?new Set(ids):null;const cl=D.clients.filter(c=>!set||set.has(c.id));const cids=new Set(cl.map(c=>c.id));
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(cl.map(c=>fmtRow(c,F.client))),'Clients');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.contrats.filter(k=>cids.has(k.clientId)).map(k=>({Client:cname(cli(k.clientId)),'Réf. client':cli(k.clientId)?.reference||'',...fmtRow(k,F.contrat)}))),'Contrats');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.sinistres.filter(k=>cids.has(k.clientId)).map(s=>({Client:cname(cli(s.clientId)),...fmtRow({...s,contratId:D.contrats.find(x=>x.id===s.contratId)?.numero||''},F.sinistre)}))),'Sinistres');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.taches.map(t=>({Client:t.clientId?cname(cli(t.clientId)):'',Fait:t.fait?'Oui':'Non',...fmtRow({...t,clientId:''},F.tache)}))),'Tâches');
 XLSX.writeFile(wb,'CRM_GPC_'+iso(new Date())+'.xlsx')}
async function exportContrats(ids){await needX();const s=new Set(ids);const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.contrats.filter(k=>s.has(k.id)).map(k=>{const c=cli(k.clientId)||{};return {Client:cname(c),'Réf. client':c.reference||'',Type:c.type||'',Téléphone:c.tel||'',Email:c.email||'',...fmtRow(k,F.contrat)}})),'Contrats');XLSX.writeFile(wb,'Contrats_GPC_'+iso(new Date())+'.xlsx')}

function guess(h){const n=norm(h);const R=[[/raison|^nom|client|assure|souscripteur|societe|entreprise|denomination/,'c.nom'],[/prenom/,'c.prenom'],[/ref.*client|code client|n.? ?client/,'c.reference'],[/siret|siren/,'c.siret'],[/activite|metier|naf/,'c.activite'],[/adresse|rue/,'c.adresse'],[/code postal|^cp$/,'c.cp'],[/ville|commune/,'c.ville'],[/tel|portable|mobile/,'c.tel'],[/mail/,'c.email'],[/naissance/,'c.dateNaissance'],[/gerant|contact/,'c.gerant'],
  [/compagnie|assureur|porteur/,'k.compagnie'],[/grossiste|intermediaire|partenaire/,'k.intermediaire'],[/branche|type.*contrat|risque|garantie|categorie/,'k.branche'],[/produit|formule/,'k.produit'],[/n.? ?(de )?(contrat|police)|police|contrat/,'k.numero'],[/effet|souscription/,'k.dateEffet'],[/echeance/,'k.echeance'],[/fraction|periodicite/,'k.fractionnement'],[/taux/,'k.tauxCom'],[/commission|com\b|comm/,'k.commission'],[/ht/,'k.primeHT'],[/prime|cotisation|ttc|montant/,'k.primeTTC'],[/statut|etat|situation/,'k.statut']];
 for(const [r,t] of R)if(r.test(n))return t;return''}
let IMP=null;
async function impFile(f){await needX();const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});
 IMP={wb,sheets:wb.SheetNames.map(n=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:true});let hi=rows.findIndex(r=>r.filter(x=>String(x).trim()).length>=2);if(hi<0)hi=0;return {n,rows,hi}})};
 const hs=[...new Set(IMP.sheets.flatMap(s=>(s.rows[s.hi]||[]).map(h=>String(h).trim()).filter(Boolean)))];IMP.headers=hs;
 $('#impzone').innerHTML=`<div class="card"><h3>1. Onglets à importer</h3>${IMP.sheets.map((s,i)=>`<label style="display:block"><input type="checkbox" style="width:auto" class="shk" value="${i}" ${s.rows.length>s.hi+1?'checked':''}> ${esc(s.n)} <span class="muted">(${Math.max(0,s.rows.length-s.hi-1)} lignes)</span></label>`).join('')}
 <label style="display:block;margin-top:8px"><input type="checkbox" style="width:auto" id="shcomp" checked> Si la colonne Compagnie est vide, utiliser le <b>nom de l'onglet</b> comme compagnie</label></div>

 <p><label><input type="checkbox" style="width:auto" id="dedup" checked> Regrouper les lignes d'un même client (même nom) en une seule fiche avec plusieurs contrats</label></p>
 <div class="row"><span class="sp"></span><button class="btn p" onclick="impRun()">Importer</button></div></div>`}
function toISO(v){if(v instanceof Date)return iso(v);const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);if(/^\d{5}$/.test(s)){return iso(new Date(Date.UTC(1899,11,30)+(+s)*864e5))}return s}
function impRun(){const map={};document.querySelectorAll('.mp').forEach(s=>{if(s.value)map[s.dataset.h]=s.value});
 if(!Object.values(map).includes('c.nom'))return alert('Indiquez au moins la colonne « Client : Nom ».');
 const useSheet=$('#shcomp').checked,dd=$('#dedup').checked;const idx=new Map(D.clients.map(c=>[norm(cname(c)),c]));let nc=0,nk=0;
 const dateK=new Set(['c.dateNaissance','k.dateEffet','k.echeance']);
 document.querySelectorAll('.shk:checked').forEach(cb=>{const s=IMP.sheets[+cb.value];const H=(s.rows[s.hi]||[]).map(h=>String(h).trim());
  for(const r of s.rows.slice(s.hi+1)){const c={},k={};H.forEach((h,i)=>{const t=map[h];if(!t)return;let v=r[i];if(v===''||v==null)return;v=dateK.has(t)?toISO(v):(v instanceof Date?fr(iso(v)):String(v).trim());const [o,f]=t.split('.');(o==='c'?c:k)[f]=(o==='c'?c:k)[f]?(o==='c'?c:k)[f]+' '+v:v});
   if(!c.nom)continue;if(c.type&&/part/i.test(c.type))c.type='Particulier';else if(c.type)c.type='Professionnel';
   let cl=dd?idx.get(norm([c.nom,c.prenom].filter(Boolean).join(' '))):null;
   if(!cl){cl=touch({id:uid(),statut:'Client',type:c.type||'Professionnel',createdAt:Date.now(),journal:[],...c});D.clients.push(cl);idx.set(norm(cname(cl)),cl);nc++}
   else{for(const f in c)if(!cl[f])cl[f]=c[f];touch(cl)}
   if(Object.keys(k).length){if(!k.compagnie&&useSheet)k.compagnie=s.n;
    if(k.statut){const st=norm(k.statut);k.statut=/resili/.test(st)?'Résilié':/suspen/.test(st)?'Suspendu':/sans effet|annul/.test(st)?'Sans effet':/attente/.test(st)?'En attente':'En cours'}
    ['primeTTC','primeHT','commission','tauxCom'].forEach(f=>{if(k[f]!=null)k[f]=String(num(k[f]))});
    if(k.numero&&D.contrats.some(x=>x.numero===k.numero&&x.clientId===cl.id))continue;
    D.contrats.push(touch({id:uid(),clientId:cl.id,statut:'En cours',...k}));nk++}}});
 dirty();$('#impzone').innerHTML=`<div class="card"><b>Import terminé :</b> ${nc} client(s) créé(s), ${nk} contrat(s) ajouté(s). <a href="#/clients">Voir les clients</a></div>`;toast('Import terminé')}

/* ================= INTÉGRATION AUTOMATIQUE (dossier OneDrive CRM_GPC/A_integrer) ================= */
const INBOX=ROOT+'/A_integrer';
function findClient(m){if(!m)return null;const sd=digits(m.siret).slice(0,9);
 return (sd.length===9&&D.clients.find(c=>digits(c.siret).slice(0,9)===sd))||D.clients.find(c=>norm(cname(c))===norm([m.nom,m.prenom].filter(Boolean).join(' ')))||D.clients.find(c=>norm(c.nom)===norm(m.nom))||null}
function upsertClient(m,src){let c=findClient(m);if(!c){c=touch({id:uid(),statut:'Client',type:m.siret?'Professionnel':'Particulier',createdAt:Date.now(),journal:[]});D.clients.push(c)}
 for(const f of F.client.map(x=>x.k))if(m[f]!==undefined&&m[f]!==''&&f!=='notes')c[f]=String(m[f]);if(m.notes)c.notes=[c.notes,m.notes].filter(Boolean).join('\n');if(m.pjFolder&&!c.pjFolder)c.pjFolder=m.pjFolder;touch(c);return c}
function addJournal(c,t){c.journal=c.journal||[];c.journal.push({d:Date.now(),t});touch(c)}
function applyUpdate(u,fname){let n=0;const src=u.source||fname;
 for(const m of u.clients||[]){const c=upsertClient(m);addJournal(c,'Intégré automatiquement ('+src+')');n++}
 for(const k of u.contrats||[]){const c=upsertClient(k.client||{});let x=k.numero&&D.contrats.find(z=>z.numero&&norm(z.numero)===norm(k.numero));
  if(!x){x={id:uid(),clientId:c.id,statut:'En cours'};D.contrats.push(x)}
  for(const f of F.contrat.map(y=>y.k))if(k[f]!==undefined&&k[f]!==''&&f!=='notes')x[f]=String(k[f]);if(k.notes)x.notes=[x.notes,k.notes].filter(Boolean).join(' · ');
  if(!x.echeance&&x.dateEffet&&x.statut==='En cours')x.echeance=x.dateEffet;touch(x);addJournal(c,'Contrat '+(x.compagnie||'')+' '+(x.numero||'')+' : '+(k.evenement||'mise à jour')+' ('+src+')');n++}
 for(const s of u.sinistres||[]){const c=upsertClient(s.client||{});let x=s.numero&&D.sinistres.find(z=>z.numero&&norm(z.numero)===norm(s.numero));
  if(!x){x={id:uid(),clientId:c.id,statut:'Ouvert'};D.sinistres.push(x)}
  if(s.contratNumero){const k=D.contrats.find(z=>norm(z.numero)===norm(s.contratNumero));if(k)x.contratId=k.id}
  for(const f of F.sinistre.map(y=>y.k))if(s[f]!==undefined&&s[f]!==''&&f!=='contratId'&&f!=='description')x[f]=String(s[f]);if(s.description)x.description=[x.description,new Date().toLocaleDateString('fr-FR')+' : '+s.description].filter(Boolean).join('\n');
  touch(x);addJournal(c,'Sinistre '+(x.numero||'')+' : '+(s.evenement||'mise à jour')+' ('+src+')');n++}
 for(const cm of u.commissions||[]){const x=D.contrats.find(z=>z.numero&&norm(z.numero)===norm(cm.numero));if(!x)continue;
  if(cm.commissionAnnuelle!==undefined)x.commission=String(cm.commissionAnnuelle);
  x.notes=[x.notes,'Commission '+(cm.periode||'')+' : '+eur(cm.montant)+(cm.statut?' ('+cm.statut+')':'')].filter(Boolean).join(' · ');touch(x);n++}
 for(const t of u.taches||[]){const c=t.client?findClient(t.client):null;D.taches.push(touch({id:uid(),clientId:c?c.id:'',titre:t.titre,echeance:t.echeance||iso(new Date()),type:t.type||'Autre',priorite:t.priorite||'Normale',notes:t.notes||'',fait:false}));n++}
 for(const j of u.journal||[]){const c=findClient(j.client);if(c){addJournal(c,j.t);n++}}
 return n}
async function processInbox(){if(MODE!=='onedrive'||!LOADED)return;
 try{const r=await G(`/me/drive/root:/${enc(INBOX)}:/children?$top=200`);if(!r.ok)return;const files=((await r.json()).value||[]).filter(f=>f.file&&/\.json$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name));if(!files.length)return;
  let dest=await G(`/me/drive/root:/${enc(INBOX+'/Traites')}`);if(dest.status===404)dest=await G(`/me/drive/root:/${enc(INBOX)}:/children`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Traites',folder:{}})});const did=(await dest.json()).id;
  let tot=0;for(const f of files){try{const c=await G(`/me/drive/items/${f.id}/content`);const u=JSON.parse(await c.text());tot+=applyUpdate(u,f.name);
    await G(`/me/drive/items/${f.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({parentReference:{id:did}})})}catch(e){console.error('[CRM] fichier à intégrer illisible',f.name,e)}}
  if(tot){dirty();route();toast(tot+' mise(s) à jour intégrée(s) automatiquement')}}catch(e){console.error(e)}}

 const v=parts[0];document.querySelectorAll('#side nav a').forEach(a=>a.classList.toggle('on',a.dataset.n===(v==='client'?'clients':v)));
 const fn=V[v]||V.dashboard;const y=window.scrollY;$('#main').innerHTML=fn(p,parts[1],parts[2]);if(route.last===location.hash)window.scrollTo(0,y);route.last=location.hash}
window.addEventListener('hashchange',route);
