name: Build APK

on:
  push:
    tags: ['v*']
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: assistant-ia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Renommer l'APK
        if: startsWith(github.ref, 'refs/tags/')
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AssistantIA-${{ github.ref_name }}.apk

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AssistantIA-${{ github.ref_name }}.apk
          body: |
            Assistant IA — chatbot multi-IA gratuit (Android).
            Installation : télécharger le fichier .apk ci-dessous, l'ouvrir et autoriser l'installation.
